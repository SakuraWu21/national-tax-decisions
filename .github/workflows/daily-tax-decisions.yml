name: 全国税务决定书每日更新

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间 12:00 = UTC 04:00。
    # GitHub 的 schedule 可能有数分钟排队延迟。
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tax-decisions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update decision database
        run: python scripts/update_tax_decisions.py | tee update-summary.log

      - name: Verify output
        run: python scripts/verify_system.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data public/data public/downloads; then
            echo "No generated file changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/全国税务处理及行政处罚决定书汇总.xlsx \
            data/全国税务处理及行政处罚决定书汇总.csv \
            data/candidate_audit.jsonl \
            public/data/tax-decisions.json \
            public/data/update-status.json \
            public/downloads/全国税务处理及行政处罚决定书汇总.xlsx \
            public/downloads/全国税务处理及行政处罚决定书汇总.csv
          git commit -m "data: update tax decisions $(date +%F)"
          git push

      - name: Optional Vercel deploy hook
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"

      - name: Write run summary
        if: always()
        run: |
          echo "## 全国税务决定书每日更新" >> "$GITHUB_STEP_SUMMARY"
          echo "- 计划时间：北京时间每日 12:00（UTC 04:00）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 定时任务可能因 GitHub Actions 排队延迟数分钟。" >> "$GITHUB_STEP_SUMMARY"
          if [ -f update-summary.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 update-summary.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
